name: Build EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed ^
            --name "搜狐国际新闻采集器" ^
            --add-data "config.py;." ^
            --add-data "models.py;." ^
            --add-data "scraper.py;." ^
            --add-data "worker.py;." ^
            --add-data "exporter.py;." ^
            --add-data "history.py;." ^
            --add-data "ui_main.py;." ^
            --add-data "ui_widgets.py;." ^
            main.py
        shell: cmd

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SohuNewsScraper-Windows
          path: dist/*.exe
